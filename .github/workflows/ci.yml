name: CI

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Qt6 + build tools
        run: |
          sudo apt-get update
          # --install-recommends: Ubuntu's runner images disable apt Recommends
          # by default, but Debian/Ubuntu split several QML modules (e.g.
          # qml6-module-qtqml-workerscript, pulled in transitively by plain
          # QtQuick) into separate packages that qt6-declarative-dev only
          # Recommends rather than hard-Depends on.
          sudo apt-get install -y --install-recommends \
            qt6-base-dev \
            qt6-declarative-dev \
            qt6-serialbus-dev \
            qt6-connectivity-dev \
            qml6-module-qtqml-workerscript \
            cmake \
            ninja-build

      - name: Configure
        run: cmake -S . -B build -G Ninja -DBUILD_TESTING=ON -DCMAKE_BUILD_TYPE=Debug

      - name: Build
        run: cmake --build build

      - name: Run tests
        working-directory: build
        env:
          QT_QPA_PLATFORM: offscreen
        run: ctest --output-on-failure
