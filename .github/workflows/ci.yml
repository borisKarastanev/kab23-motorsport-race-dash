name: CI

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Qt6 + build tools
        run: |
          sudo apt-get update
          # Debian/Ubuntu split every Qt6 QML submodule into its own
          # qml6-module-* package (WorkerScript, Window, ... — whichever
          # transitive import QtQuick/QtTest happens to need), and
          # qt6-declarative-dev only Recommends most of them rather than
          # hard-Depending on them; ubuntu-latest runners also disable apt
          # Recommends by default. Rather than chase individual missing
          # modules one CI run at a time, grab every qml6-module-* package
          # via apt's glob support in one shot.
          sudo apt-get install -y --install-recommends \
            qt6-base-dev \
            qt6-declarative-dev \
            qt6-serialbus-dev \
            qt6-connectivity-dev \
            'qml6-module-*' \
            cmake \
            ninja-build

      - name: Configure
        run: cmake -S . -B build -G Ninja -DBUILD_TESTING=ON -DCMAKE_BUILD_TYPE=Debug

      - name: Build
        run: cmake --build build

      - name: Run tests
        working-directory: build
        env:
          QT_QPA_PLATFORM: offscreen
        run: ctest --output-on-failure
